name: crest
on:
  pull_request:
    paths:
      - crest/**
      - crest-greeter/**
      - packages/crest/**
      - packages/crest-greeter/**
      - tools/crest-qml.sh
      - .github/workflows/crest.yml
permissions:
  contents: read
jobs:
  qml:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pacman -Syu --noconfirm --needed quickshell qt6-declarative qt6-imageformats qt6-svg matugen inter-font ttf-jetbrains-mono ttf-material-symbols-variable noto-fonts-emoji findutils grep
      - name: matugen output
        run: matugen image crest/assets/wallpaper.webp -t scheme-tonal-spot -m dark --json hex --dry-run --source-color-index 0 | tee "$RUNNER_TEMP/scheme.json" | head -c 4000
      - run: tools/crest-qml.sh unit
      - run: tools/crest-qml.sh lint
      - run: tools/crest-qml.sh render "$GITHUB_WORKSPACE/render-out"
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: crest-render
          path: render-out
          retention-days: 3
          if-no-files-found: warn

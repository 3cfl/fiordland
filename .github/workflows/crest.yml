name: crest
on:
  pull_request:
    paths:
      - crest/**
      - crest-greeter/**
      - packages/crest/**
      - packages/crest-greeter/**
      - tools/crest-qml.sh
      - .github/workflows/crest.yml
permissions:
  contents: read
jobs:
  qml:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pacman -Syu --noconfirm --needed quickshell qt6-declarative qt6-imageformats qt6-svg inter-font ttf-jetbrains-mono noto-fonts-emoji findutils grep
      - name: probe
        continue-on-error: true
        run: |
          qs --version || true
          pacman -Q quickshell qt6-declarative
          for p in matugen ttf-material-symbols-variable cage greetd greetd-tuigreet hyprland; do pacman -Si "$p" 2>/dev/null | sed -n '1,3p' || echo "no $p"; done
          ls /usr/lib/qt6/qml/Quickshell
          grep -rl usingLua /usr/lib/qt6/qml/Quickshell || echo "no usingLua"
          find /usr/lib/qt6/qml/Quickshell -name '*.qmltypes' | head -40
          for f in Services/Greetd Networking Hyprland Wayland Services/Pam; do find "/usr/lib/qt6/qml/Quickshell/$f" -name '*.qmltypes' -exec grep -E 'name: "|Signal|Method' {} + | head -120; done
          /usr/lib/qt6/bin/qmllint --help | head -80
      - run: tools/crest-qml.sh unit
      - run: tools/crest-qml.sh lint
      - run: tools/crest-qml.sh render "$GITHUB_WORKSPACE/render-out"
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: crest-render
          path: render-out
          retention-days: 3
          if-no-files-found: warn

name: Publish signed XFCE container
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release date (YYYY.MM.DD)
        type: string
        required: true
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: publish-fiordland-xfce
    env:
      VERSION: ${{ inputs.version }}
      IMAGE: ghcr.io/fiordland-linux/fiordland-xfce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and import the published root filesystem
        run: |
          set -euo pipefail
          [[ $VERSION =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]
          file="fiordland-xfce-$VERSION.tar.zst"
          url="https://fiordlandlinux.org/iso/container/$file"
          curl --fail --location --retry 3 "$url" -o "$RUNNER_TEMP/$file"
          curl --fail --location --retry 3 "$url.sig" -o "$RUNNER_TEMP/$file.sig"
          gpgv --keyring "$GITHUB_WORKSPACE/ops/mirrors/fiordland.gpg" "$RUNNER_TEMP/$file.sig" "$RUNNER_TEMP/$file"
          tar --zstd -xOf "$RUNNER_TEMP/$file" ./etc/fiordland/image > "$RUNNER_TEMP/image-info"
          grep -Fx "built=$VERSION" "$RUNNER_TEMP/image-info"
          snapshot=$(sed -n 's/^snapshot=//p' "$RUNNER_TEMP/image-info")
          selkies=$(sed -n 's/^selkies=//p' "$RUNNER_TEMP/image-info")
          zstd -dc "$RUNNER_TEMP/$file" | docker import \
            --change 'ENV LANG=en_US.UTF-8' \
            --change 'ENV NVIDIA_DRIVER_CAPABILITIES=all' \
            --change 'ENV NVIDIA_VISIBLE_DEVICES=all' \
            --change 'CMD ["/usr/local/bin/fiordland-selkies"]' \
            --change 'EXPOSE 8080' \
            --change 'LABEL org.opencontainers.image.source=https://github.com/Fiordland-Linux/fiordland' \
            --change "LABEL org.opencontainers.image.version=$VERSION" \
            --change "LABEL lat.apollo44.fiordland.snapshot=$snapshot" \
            --change "LABEL lat.apollo44.fiordland.selkies=$selkies" - "$IMAGE:$VERSION"
          docker run --rm "$IMAGE:$VERSION" sh -ec 'test -x /usr/local/bin/fiordland-selkies && command -v selkies'
      - name: Push dated and latest tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:latest"

name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y shellcheck yamllint python3-venv
      - run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install check-jsonschema==0.39.0 pytest==9.2.0
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: tools/lint.sh
      - run: bash ops/mirrors/test_sync.sh
      - run: bash tools/test_release_check.sh
      - run: bash tools/test_migrations.sh
      - run: python3 -m pytest -q bot
      - run: python3 -m py_compile ops/docs/build.py && mkdir -p "$RUNNER_TEMP/site" && python3 ops/docs/build.py "$RUNNER_TEMP/site" 0
  packages:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        pkg: [fiordland-keyring, fiordland-base, fiordland-desktop, fiordland-tune, rawaru, tawaki]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pacman -Syu --noconfirm --needed git namcap
      - run: |
          useradd -m b
          echo 'b ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/b
          chown -R b .
      - working-directory: packages/${{ matrix.pkg }}
        run: |
          bash -c 'source PKGBUILD; [ ${#makedepends[@]} -eq 0 ] || pacman -S --noconfirm --needed "${makedepends[@]}"'
          su b -c 'makepkg -d --noconfirm --skippgpcheck'
      - working-directory: packages/${{ matrix.pkg }}
        run: $GITHUB_WORKSPACE/tools/namcap.sh ./*.pkg.tar.zst
  fiordland-tune:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/fiordland-tune
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pacman -Syu --noconfirm --needed rust
      - run: cargo fmt --check
      - run: cargo clippy --locked --offline --all-targets -- -D warnings
      - run: cargo test --locked --offline
  kereru:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pacman -Syu --noconfirm --needed rust git namcap fontconfig freetype2 libxkbcommon libxkbcommon-x11 wayland libglvnd libx11 libxcursor libxrandr libxi
      - working-directory: kereru
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - run: |
          useradd -m b
          chown -R b .
      - working-directory: packages/kereru
        run: |
          su b -c 'makepkg -d --noconfirm'
          "$GITHUB_WORKSPACE/tools/namcap.sh" ./*.pkg.tar.zst
  namcap:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pacman -Syu --noconfirm --needed namcap
      - run: |
          useradd -m b
          chown -R b .
      - run: su b -c 'find packages -name PKGBUILD -print0 | xargs -0 tools/namcap.sh'

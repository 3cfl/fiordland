name: release-check
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - packages/tawaki/**
      - packages/rawaru/**
      - packages/kuaka/**
      - packages/weka/**
permissions:
  contents: read
jobs:
  releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/release-check.sh

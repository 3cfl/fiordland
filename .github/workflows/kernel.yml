name: kernel
on:
  workflow_dispatch:
  pull_request:
    paths:
      - packages/linux-fiord/**
      - tools/kernel-build.sh
      - .github/workflows/kernel.yml
permissions:
  contents: read
concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/kernel-build.sh prepare
  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune -af
          df -h /
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: kernel-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: kernel-ccache-
      - name: build in archlinux:base-devel
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w \
            -e CCACHE_DIR=/w/.ccache -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            archlinux:base-devel tools/kernel-build.sh build
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: kernel-ccache-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-fiord-packages
          path: packages/linux-fiord/*.pkg.tar.zst
          retention-days: 5
          compression-level: 0
          if-no-files-found: error

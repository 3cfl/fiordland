proxy_cache_path /var/cache/fiordland-stable levels=1:2 keys_zone=fstable:64m max_size=40g inactive=120d use_temp_path=off;

include /etc/fiordland/stable-date.conf;

map $stable_file $stable_key {
    ~\.(db|files)(\.tar\.gz)?(\.sig)?$ "$stable_date/$stable_repo/$stable_file";
    default "pkg/$stable_file";
}

server {
    listen 127.0.0.1:8091;
    resolver 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
    resolver_timeout 5s;
    access_log off;

    location = /stable/date {
        default_type text/plain;
        return 200 "$stable_date\n";
    }

    location ~ ^/stable/(?<stable_repo>core|extra|multilib)/os/x86_64/(?<stable_file>[A-Za-z0-9@._+:-]+)$ {
        proxy_pass https://archive.archlinux.org/repos/$stable_date/$stable_repo/os/x86_64/$stable_file;
        proxy_ssl_server_name on;
        proxy_set_header Host archive.archlinux.org;
        proxy_cache fstable;
        proxy_cache_key $stable_key;
        proxy_cache_valid 200 3650d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 120s;
        proxy_intercept_errors on;
        error_page 404 = @previous;
        add_header X-Fiordland-Stable $stable_date always;
        add_header X-Cache $upstream_cache_status always;
    }

    location @previous {
        proxy_pass https://archive.archlinux.org/repos/$stable_previous/$stable_repo/os/x86_64/$stable_file;
        proxy_ssl_server_name on;
        proxy_set_header Host archive.archlinux.org;
        proxy_cache fstable;
        proxy_cache_key $stable_key;
        proxy_cache_valid 200 3650d;
        add_header X-Fiordland-Stable $stable_previous always;
    }

    location / {
        return 404;
    }
}

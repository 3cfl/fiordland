[package]
name = "kereru"
version = "0.1.0"
edition = "2021"
description = "Live Wallpaper Engine wallpapers for Fiordland Linux"
license = "GPL-3.0-only"
publish = false

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "software-renderer-path", "accessibility"] }
wayland-client = "0.31"

[build-dependencies]
slint-build = "1.19"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
